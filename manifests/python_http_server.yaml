apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-server
  labels:
    app: python-http-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-http-server
  template:
    metadata:
      labels:
        app: python-http-server
    spec:
      containers:
      - name: python-server
        image: python:3.12-slim
        ports:
        - containerPort: 80
        command: ["python", "-m", "http.server","8000"]

        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        
        readinessProbe:
          httpGet:
            path: /
            port: 80
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: python-server
spec:
  selector:
    app: python-http-server
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 80
  type: ClusterIP